name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Run tests
        run: npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "Using explicit tag: v${VERSION}"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            echo "Latest tag: ${LATEST_TAG}"

            IFS='.' read -r major minor patch <<< "${LATEST_TAG#v}"
            patch=$((patch + 1))
            VERSION="${major}.${minor}.${patch}"
            TAG="v${VERSION}"

            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "Auto-bumped: ${LATEST_TAG} → ${TAG}"
          fi

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Create release bundle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUNDLE_DIR="claude-mcp-server-${VERSION}"
          mkdir -p "$BUNDLE_DIR"

          cp server.js command-builder.js stream-format.js modes.js package.json package-lock.json setup.sh "$BUNDLE_DIR/"
          cp -r node_modules "$BUNDLE_DIR/node_modules"

          tar czf "claude-mcp-server-${VERSION}.tar.gz" "$BUNDLE_DIR"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          make_latest: "true"
          generate_release_notes: true
          files: claude-mcp-server-${{ steps.version.outputs.version }}.tar.gz
          body: |
            ## Install

            ```bash
            bash <(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh)
            ```

            Or download `claude-mcp-server-${{ steps.version.outputs.version }}.tar.gz`, extract, and run `./setup.sh`.

            **Prerequisites:** Node.js >= 20, [Claude CLI](https://docs.anthropic.com/en/docs/claude-cli)
